[package]
name = "enig-term-core"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "WASM emulation core for enig-term: a thin wasm-bindgen wrapper around icy_engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# icy_tools is pinned to an exact revision. Several of icy_tools' own git
# dependencies (icy_sauce, retrofont, libyaff, codepages) are declared WITHOUT a
# rev upstream, so our Cargo.lock is the only thing that pins them: commit it.
# default-features = false turns off icy_engine's "embedded-fonts": no font
# data is compiled in, and the shell loads the fonts it ships at runtime.
icy_engine = { git = "https://github.com/mkrueger/icy_tools", rev = "274262d834d02fa6bccd49d94109226146b00b96", default-features = false }
icy_parser_core = { git = "https://github.com/mkrueger/icy_tools", rev = "274262d834d02fa6bccd49d94109226146b00b96" }
# Same source spec as icy_engine uses (no rev), so both resolve to one copy;
# Cargo.lock pins it.
icy_sauce = { git = "https://github.com/mkrueger/icy_sauce" }
wasm-bindgen = "=0.2.129"
serde_json = "1"
# Already in the tree (icy_parser_core uses it); scans APC bodies for ST.
memchr = "2"
parking_lot = "0.12.5"

[features]
default = []
# Whole-file viewer path through icy_engine's FileFormat loaders. It pulls in
# every format loader (images, XBin, IcyDraw, archives ...) and roughly doubles
# the WASM, so it is off by default. SAUCE art works without it (load_sauce_art).
viewer = []

# The pinned icy_tools revision above, with patches/icy_tools/*.patch applied
# (none at this revision), prepared by scripts/prepare-icy.sh (build-wasm.sh
# runs it).
[patch."https://github.com/mkrueger/icy_tools"]
icy_engine = { path = "../../build/icy_tools/crates/icy_engine" }
icy_parser_core = { path = "../../build/icy_tools/crates/icy_parser_core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
