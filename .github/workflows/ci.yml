# Build both WASM modules from a clean checkout, then run the Node unit tests
# and Playwright (Chromium, Firefox, Pixel 7; WebKit is a non-blocking step).
# dist/ is uploaded as an artifact.
#
# The toolchain pins and setup live in .github/actions/setup-build, shared
# with release.yml. CI keeps the npm and cargo caches (it publishes nothing);
# cargo builds --locked, and the checkout keeps no token in .git/config.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner has no sound output: audio specs are local-only (playwright.config.ts).
  ENIG_TERM_SKIP_AUDIO: '1'

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain and npm ci
        uses: ./.github/actions/setup-build

      - name: Build (WASM, then dist/)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Transfer programs (lrzsz; sexyz is not packaged and its tests skip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lrzsz

      - name: Node unit tests
        run: npm run test:unit

      - name: Playwright browsers (Chromium, Firefox)
        run: npx playwright install --with-deps chromium firefox

      - name: Playwright (Chromium, Firefox, Pixel 7)
        run: npx playwright test --project=chromium --project=firefox --project=chromium-pixel7

      - name: Playwright WebKit (optional)
        continue-on-error: true
        env:
          ENIG_TERM_REQUIRE_WEBKIT: '1'
        run: |
          npx playwright install --with-deps webkit
          npx playwright test --project=webkit --project=webkit-iphone

      - name: Upload dist/
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enig-term-dist
          path: dist/
          if-no-files-found: warn

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-screenshots
          path: |
            test/screenshots/
            test-results/
          if-no-files-found: ignore
