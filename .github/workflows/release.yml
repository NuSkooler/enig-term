# On a pushed tag vX.Y.Z: check the tag against package.json, build dist/ with
# CI's pinned toolchain (.github/actions/setup-build), run the Node unit
# tests, package dist/ (scripts/package-release.sh) and publish a GitHub
# Release with the archives, SHA256SUMS and the CHANGELOG section as notes.
# Playwright is left to CI on main.
#
# Three jobs, so that no write permission is held while code from the
# repository or its dependencies runs:
#   build    contents: read. A clean build: no npm or cargo cache restored (a
#            cache CI wrote never reaches a release), cargo --locked, and the
#            checkout keeps no token. Uploads the release files as the
#            workflow artifact "release".
#   attest   id-token + attestations: write. Signs build provenance for the
#            archives (verify with `gh attestation verify`, docs/building.md).
#   publish  contents: write. Creates the GitHub Release from the artifact.
# attest and publish check out nothing and run no repository code.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches package.json
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Toolchain and npm ci (no caches)
        uses: ./.github/actions/setup-build
        with:
          cache: 'false'

      - name: Build (WASM, then dist/)
        run: npm run build

      - name: Transfer programs (lrzsz; sexyz is not packaged and its tests skip)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lrzsz

      - name: Node unit tests
        run: npm run test:unit

      - name: Package and check
        run: scripts/package-release.sh "$VERSION" release

      # Four files at the artifact's root (their common parent, release/, is
      # dropped): the two archives, SHA256SUMS and notes.md.
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/enig-term-${{ env.VERSION }}.zip
            release/enig-term-${{ env.VERSION }}.tar.gz
            release/SHA256SUMS
            release/notes.md
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Check SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Build provenance for the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/enig-term-${{ env.VERSION }}.zip
            release/enig-term-${{ env.VERSION }}.tar.gz

  publish:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Check SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS

      # No checkout here, so gh is told the repository.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "enig-term $VERSION" \
            --notes-file release/notes.md \
            "release/enig-term-$VERSION.zip" \
            "release/enig-term-$VERSION.tar.gz" \
            release/SHA256SUMS
