<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>enig-term</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; }
  body { display: flex; flex-direction: column; }
  enig-term { flex: 1 1 auto; min-height: 0; height: 100dvh; }
  noscript { color: #d6d6de; font: 16px system-ui, sans-serif; padding: 16px; display: block; }
</style>
<script type="module" src="enig-term.js"></script>
</head>
<body>
  <!-- Standalone page: reads ./config.json if there is one (see docs/configuration.md),
       URL parameters (endpoint, connect, ...) override it (an endpoint from the URL asks
       before connecting), and without an endpoint the host input asks for one. -->
  <enig-term config="config.json" url-params fill></enig-term>
  <noscript>enig-term needs JavaScript and WebAssembly.</noscript>
  <script type="module">
    // Keep the page title in step with the board's title and OSC title changes.
    const el = document.querySelector('enig-term');
    customElements.whenDefined('enig-term').then(() => el.ready).then(h => {
      const base = h.getOption('title');
      document.title = base;
      h.on('title', ev => { const t = String(ev.title ?? '').slice(0, 256); document.title = t ? `${t} - ${base}` : base; });
      window.enigTerm = h.terminal; // diagnostics and tests
      document.body.dataset.ready = '1';
    }).catch(() => { document.body.dataset.ready = 'error'; });
  </script>
</body>
</html>
